[project]
name = "inventra-api"
version = "0.1.0"
description = "Inventra backend: REST API for inventory, batches, sales and forecasts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1.0",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    # [email] adds email-validator, used by Pydantic's EmailStr type.
    "pydantic[email]>=2.14,<3.0",
    "pydantic-settings>=2.16",
    # Password hashing with Argon2 (the library recommended by the FastAPI docs).
    "pwdlib[argon2]>=0.3.1",
    # Runs the demand model. Exactly the version it was trained with: a saved model isn't
    # guaranteed to load correctly in any other one.
    "scikit-learn==1.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    # HTTP client used by FastAPI's TestClient in the tests.
    "httpx2>=2.16",
    "ruff>=0.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.forecasting" = ["demand_model.joblib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
# Migration files are generated by Alembic; we review them, but don't restyle them.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in defaults is the intended pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
